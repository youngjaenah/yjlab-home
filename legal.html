<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ page.title }} — yjlab</title>
<meta name="description" content="{{ page.title }} · YomiClaw / yjlab" />
<meta name="robots" content="all" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #07070c; --ink: #ECEAE4; --ink-dim: #a3a1af; --ink-faint: #6a6878;
    --gold: #E8C68A; --indigo: #8B9CFF; --line: rgba(236,234,228,0.10);
    --serif: "Fraunces", Georgia, serif;
    --sans: "Pretendard", -apple-system, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(ellipse 70% 40% at 80% -5%, rgba(139,156,255,0.08), transparent 60%), var(--bg);
    color: var(--ink); font-family: var(--sans); line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header { border-bottom: 1px solid var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-family: var(--serif); font-size: 1.2rem; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgba(232,198,138,0.6); }
  .back { color: var(--ink-dim); text-decoration: none; font-size: 0.9rem; transition: color .2s; }
  .back:hover { color: var(--gold); }

  .doc { padding: 70px 0 100px; }
  .eyebrow { font-size: 0.78rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.1rem, 5vw, 3rem); letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 12px; }
  .meta { color: var(--ink-faint); font-size: 0.9rem; margin-bottom: 44px; }

  /* markdown-generated content */
  .content h2 {
    font-family: var(--serif); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.01em;
    margin: 44px 0 14px; padding-top: 30px; border-top: 1px solid var(--line);
  }
  .content > h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .content h3 { font-size: 1.02rem; font-weight: 600; margin: 22px 0 8px; color: var(--ink); }
  .content p, .content li { color: var(--ink-dim); font-size: 0.98rem; }
  .content p { margin-bottom: 14px; }
  .content ul, .content ol { margin: 0 0 16px 22px; }
  .content li { margin-bottom: 8px; }
  .content strong { color: var(--ink); }
  .content a { color: var(--gold); }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .content table { width: 100%; border-collapse: collapse; margin: 8px 0 22px; font-size: 0.92rem; }
  .content th, .content td { text-align: left; padding: 11px 14px; border: 1px solid var(--line); color: var(--ink-dim); vertical-align: top; }
  .content th { color: var(--ink); font-weight: 600; background: rgba(236,234,228,0.03); }

  /* blockquote → gold callout */
  .content blockquote {
    border-left: 3px solid var(--gold); background: rgba(232,198,138,0.05);
    padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 20px 0; color: var(--ink);
  }
  .content blockquote p { color: var(--ink); margin-bottom: 0; }

  .content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em;
    background: rgba(236,234,228,0.07); padding: 2px 6px; border-radius: 5px; color: var(--gold);
  }

  footer { border-top: 1px solid var(--line); padding: 36px 0; }
  .foot { color: var(--ink-faint); font-size: 0.85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .foot a { color: var(--ink-dim); text-decoration: none; }
  .foot a:hover { color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/"><span class="dot"></span>yjlab</a>
    <a class="back" href="/">← 홈으로</a>
  </div>
</header>

<main class="doc">
  <div class="wrap">
    <p class="eyebrow">YomiClaw</p>
    <h1>{{ page.title }}</h1>
    {% if page.updated %}<p class="meta">최종 수정일: {{ page.updated }}</p>{% endif %}
    <div class="content">
      {{ content }}
    </div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span>© 2026 yjlab</span>
    <span>
      <a href="/yomiclaw/privacy/">개인정보처리방침</a> ·
      <a href="/yomiclaw/terms/">이용약관</a> ·
      <a href="/">yjlab.io →</a>
    </span>
  </div>
</footer>

</body>
</html>
